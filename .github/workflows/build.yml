name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # Akce pinované na commit SHA (tag v komentáři) — tag lze přepsat, SHA ne.
      # persist-credentials:false → GITHUB_TOKEN (write) NEzůstane v .git/config,
      # kde by ho jinak přečetl libovolný postinstall skript při `npm ci`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bez GH_TOKEN: token s právem zápisu nemá co dělat v prostředí stovek
      # transitivních závislostí electron-builderu. Builder se ale v CI snaží
      # sám publishovat (a bez tokenu spadne) → --publish never; release
      # připíná až action-gh-release s vlastním tokenem.
      - name: Build instalátory
        run: npm run dist -- --publish never

      # Ruční běh → DRAFT release (tag test-build se u draftu reálně nevytvoří).
      # Záměrně NE upload-artifact: artefakty se počítají do Actions storage
      # kvóty (0,5 GB free — už dvakrát přetekla), release assety ne.
      - name: Testovací draft release (jen ruční běh)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: test-build ${{ matrix.os }}
          tag_name: test-build
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      # SHA256 kontrolní součty ke stažitelným balíčkům (ověřitelnost pro uživatele)
      - name: Kontrolní součty
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(*.AppImage *.deb *.exe *.dmg *.zip)
          [ ${#files[@]} -gt 0 ] && sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.os }}.txt" || true

      - name: Release (jen na tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
