name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # Akce pinované na commit SHA (tag v komentáři) — tag lze přepsat, SHA ne.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bez GH_TOKEN: build ho nepotřebuje (release připíná až action-gh-release
      # s vlastním tokenem) a token s právem zápisu nemá co dělat v prostředí
      # stovek transitivních závislostí electron-builderu.
      - name: Build instalátory
        run: npm run dist

      # Artefakty JEN u ručního běhu (workflow_dispatch) — na tagu jde totéž do
      # Release a dvojí uložení dřív přeteklo Actions storage kvótu (artefakty
      # se do kvóty počítají, release assety ne).
      - name: Nahraj artefakty (jen ruční běh)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calcamp-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - name: Release (jen na tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
