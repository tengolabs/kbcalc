name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build instalátory
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Na TAG se instalátory připnou k Release (viz krok níž) — ten se do kvóty
      # Actions storage NEpočítá. Artefakt by byl druhá kopie těch samých souborů
      # a právě ta kvótu vyčerpala (3 buildy Electronu = ~1,5 GB proti limitu 0,5 GB).
      # Artefakty tedy jen pro RUČNÍ spuštění (workflow_dispatch), kde žádný
      # Release nevzniká, a s krátkou retencí.
      - name: Nahraj artefakty (jen ruční spuštění)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: calcamp-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip

      - name: Release (jen na tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
