<title>CalcAmp</title>
<style>
  :root{
    --metal-hi:#4a4a4a; --metal:#2a2a2a; --metal-lo:#151515;
    --bezel-hi:#5a5a5a; --bezel-lo:#000;
    --lcd-bg:#0a1a0d; --lcd:#2bff77; --lcd-dim:#0f6b33;
    --amber:#ffb43a;
    --btn:#333; --btn-hi:#484848; --btn-lo:#1c1c1c;
    --accent:#2bff77;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  html,body{ background:transparent; }
  /* frameless drag regions */
  .brand{ -webkit-app-region:drag; }
  .amp-title{ -webkit-app-region:drag; }
  .wcbtn, #clock, .amp-title .x,
  .keys, .display, #nowbar, input, button, canvas, ul{ -webkit-app-region:no-drag; }
  .wc{ display:flex; align-items:center; gap:5px; }
  .wcbtn{ cursor:pointer; border:none; width:18px; height:18px; border-radius:5px;
    font-size:11px; line-height:1; color:#bbb; background:#242424;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; padding:0; }
  .wcbtn:hover{ filter:brightness(1.5); }
  .wcbtn.close:hover{ background:#c0392b; color:#fff; }
  .wcbtn.pinned{ background:#12b34e; color:#062a12; }
  body{
    font-family:"Segoe UI",Tahoma,sans-serif;
    color:#ddd;
    display:inline-flex; align-items:flex-start; justify-content:flex-start;
    padding:0; margin:0; gap:0;
    -webkit-font-smoothing:antialiased; user-select:none;
    overflow:hidden;
  }
  #app{ display:flex; align-items:stretch; }

  /* ============ CALCULATOR ============ */
  #calc{
    width:270px;
    background:linear-gradient(160deg,var(--metal-hi),var(--metal) 30%,var(--metal-lo));
    border-radius:16px;
    padding:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.65),
               inset 0 1px 0 rgba(255,255,255,.12),
               inset 0 -2px 6px rgba(0,0,0,.6);
    border:1px solid #000;
    position:relative; z-index:2;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11px; letter-spacing:2px; color:#8a8a8a;
    padding:0 4px 8px; text-transform:uppercase;
  }
  .brand b{color:var(--lcd); text-shadow:0 0 8px var(--lcd-dim);}
  .display{
    background:linear-gradient(180deg,#071206,#0a1a0d);
    border-radius:8px; border:1px solid #000;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.8), inset 0 0 0 1px rgba(43,255,119,.06);
    padding:10px 12px 8px; margin-bottom:12px; overflow:hidden;
  }
  .expr{ text-align:right; font-family:"Consolas",monospace; font-size:12px;
    color:var(--lcd-dim); min-height:16px; letter-spacing:1px; opacity:.85;}
  .out{ text-align:right; font-family:"Consolas",monospace; font-weight:600;
    font-size:34px; color:var(--lcd); text-shadow:0 0 10px rgba(43,255,119,.55);
    line-height:1.1; word-break:break-all;}
  .keys{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .key{
    appearance:none; border:none; cursor:pointer;
    height:46px; border-radius:9px; font-size:18px; font-weight:600; color:#eee;
    background:linear-gradient(180deg,var(--btn-hi),var(--btn) 55%,var(--btn-lo));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 2px 3px rgba(0,0,0,.5);
    transition:transform .05s, filter .1s;
  }
  .key:active{ transform:translateY(1px); filter:brightness(1.25); }
  .key.op{ color:var(--accent); text-shadow:0 0 8px var(--lcd-dim); }
  .key.fn{ color:var(--amber); font-size:16px; }
  .key.eq{ background:linear-gradient(180deg,#2bff77,#12b34e 60%,#0a7d36);
    color:#062a12; text-shadow:none; box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(43,255,119,.35);}

  /* now-playing mini bar */
  #nowbar{
    display:flex; align-items:center; gap:8px;
    margin-top:12px; padding:7px 8px;
    background:linear-gradient(180deg,#0a1a0d,#071206);
    border:1px solid #000; border-radius:8px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
  }
  #miniPlay, #miniNext{
    flex:0 0 auto; width:26px; height:26px; border-radius:6px; cursor:pointer;
    border:1px solid #000; color:var(--lcd);
    background:linear-gradient(180deg,var(--btn-hi),var(--btn-lo));
    font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  #miniPlay:active, #miniNext:active{ filter:brightness(1.3); transform:translateY(1px); }
  #miniWrap{ flex:1 1 auto; overflow:hidden; }
  #miniTitle{
    font-family:"Consolas",monospace; font-size:11px; color:var(--lcd);
    white-space:nowrap; text-shadow:0 0 6px var(--lcd-dim);
  }
  #miniProg{ height:3px; background:#03260f; border-radius:2px; margin-top:4px; overflow:hidden;}
  #miniBar{ height:100%; width:0%; background:var(--lcd); box-shadow:0 0 6px var(--lcd);}
  #expandBtn{
    flex:0 0 auto; width:26px; height:26px; border-radius:6px; cursor:pointer;
    border:1px solid #000; color:var(--amber); font-size:14px;
    background:linear-gradient(180deg,var(--btn-hi),var(--btn-lo));
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s;
  }

  /* ============ WINAMP PLAYER ============ */
  #player{
    width:0; overflow:hidden; opacity:0;
    transition:width .35s ease, opacity .3s ease, margin .35s ease;
    align-self:stretch; margin-left:0;
  }
  #app.open #player{ width:330px; opacity:1; margin-left:14px; }
  #app.open #expandBtn{ transform:rotate(180deg); }

  .amp{
    width:330px; height:100%;
    background:linear-gradient(160deg,#3a3a3a,#242424 30%,#101010);
    border-radius:14px; border:1px solid #000;
    box-shadow:0 24px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.1);
    display:flex; flex-direction:column; padding:10px;
  }
  .amp-title{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,#1a2b3a,#0c1620);
    border:1px solid #000; border-radius:6px; padding:5px 9px; margin-bottom:8px;
  }
  .amp-title .t{ font-size:11px; letter-spacing:3px; color:#7fd0ff; text-shadow:0 0 8px #1b4a66;}
  .amp-title .x{ cursor:pointer; color:#888; font-size:13px; padding:0 4px;}
  .amp-title .x:hover{ color:#fff; }

  .lcd{
    background:linear-gradient(180deg,#071206,#0a1a0d);
    border:1px solid #000; border-radius:6px; padding:8px 10px; margin-bottom:8px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.8);
  }
  .lcd-top{ display:flex; align-items:center; gap:10px; }
  .time{ font-family:"Consolas",monospace; font-size:24px; font-weight:700; color:var(--lcd);
    text-shadow:0 0 10px rgba(43,255,119,.5); letter-spacing:1px; }
  .meta{ font-family:"Consolas",monospace; font-size:9px; color:var(--lcd-dim); line-height:1.5; }
  .meta b{ color:var(--lcd); }
  #viz{ display:block; width:100%; height:38px; margin-top:6px; background:#040c05; border-radius:3px; }
  .marquee-wrap{ overflow:hidden; margin-top:6px; border-top:1px solid #03260f; padding-top:5px;}
  #trackTitle{ display:inline-block; white-space:nowrap; font-family:"Consolas",monospace;
    font-size:12px; color:var(--lcd); text-shadow:0 0 6px var(--lcd-dim); padding-left:100%;
    animation:marq 12s linear infinite; }
  #trackTitle.paused{ animation-play-state:paused; }
  @keyframes marq{ to{ transform:translateX(-100%);} }

  .seek{ margin-bottom:8px; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:6px; border-radius:4px;
    background:#03260f; box-shadow:inset 0 1px 3px #000; outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:16px;
    border-radius:3px; background:linear-gradient(180deg,#3bff86,#0a7d36); border:1px solid #000;
    box-shadow:0 0 6px rgba(43,255,119,.6); }

  .transport{ display:flex; gap:6px; margin-bottom:8px; }
  .tbtn{ flex:1; height:34px; border:1px solid #000; border-radius:7px; cursor:pointer; color:#ddd;
    background:linear-gradient(180deg,var(--btn-hi),var(--btn) 55%,var(--btn-lo));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12); font-size:13px;
    display:flex; align-items:center; justify-content:center; }
  .tbtn:active{ filter:brightness(1.3); transform:translateY(1px); }
  .tbtn.play{ color:var(--lcd); }
  .tbtn.eject{ color:var(--amber); }

  .sliders{ display:flex; gap:10px; align-items:center; margin-bottom:8px; font-size:9px; color:#888;}
  .sliders .grp{ flex:1; }
  .sliders label{ display:block; letter-spacing:1px; margin-bottom:3px; }

  .plwrap{ flex:1; display:flex; flex-direction:column; min-height:120px;
    background:#040c05; border:1px solid #000; border-radius:6px; overflow:hidden; }
  .plhead{ display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,#1a2b3a,#0c1620); padding:4px 8px;
    font-size:9px; letter-spacing:2px; color:#7fd0ff; }
  .plhead span{ cursor:pointer; color:var(--amber); }
  #playlist{ list-style:none; overflow-y:auto; flex:1; }
  #playlist li{ font-family:"Consolas",monospace; font-size:11px; color:var(--lcd-dim);
    padding:4px 8px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border-bottom:1px solid rgba(43,255,119,.05); }
  #playlist li:hover{ background:rgba(43,255,119,.08); color:var(--lcd); }
  #playlist li.active{ background:rgba(43,255,119,.16); color:var(--lcd); font-weight:700; }
  #playlist li .num{ color:#0a5f2b; margin-right:6px; }
  .empty{ padding:14px 8px; font-size:10px; color:#0a5f2b; font-family:"Consolas",monospace; }
  #playlist::-webkit-scrollbar{ width:8px; }
  #playlist::-webkit-scrollbar-thumb{ background:#0a5f2b; border-radius:4px; }

  /* ovládání vizualizéru */
  .viz-ctl{ display:flex; justify-content:space-between; align-items:center; margin-top:5px;
    font:9px "Consolas",monospace; letter-spacing:1px; color:var(--lcd-dim); }
  .viz-ctl span{ cursor:pointer; padding:2px 5px; border-radius:3px; user-select:none; }
  .viz-ctl span:hover{ color:var(--lcd); background:rgba(43,255,119,.1); }
  .viz-ctl b{ color:var(--lcd); }
  #viz{ cursor:pointer; }

  /* fullscreen vizualizér */
  #vizFull{ position:fixed; inset:0; background:#000; display:none; z-index:99999; cursor:pointer; }
  #vizFull.on{ display:block; }
  #vizBig{ display:block; width:100%; height:100%; }
  #vizFullBar{ position:fixed; left:0; right:0; bottom:22px; text-align:center; pointer-events:none;
    font:12px "Consolas",monospace; letter-spacing:3px; }
  #vizFullBar span{ margin:0 12px; }
  #vizFullStyle{ color:var(--lcd); text-shadow:0 0 8px var(--lcd-dim); }
  #vizFullBar .hint{ color:#0f8f42; }
</style>

<div id="app">
  <!-- CALCULATOR -->
  <div id="calc">
    <div class="brand">
      <span>CALC<b>AMP</b></span>
      <span class="wc">
        <span id="clock">88:88</span>
        <button class="wcbtn" id="pinBtn" title="Vždy navrchu">◉</button>
        <button class="wcbtn" id="minBtn" title="Minimalizovat">–</button>
        <button class="wcbtn close" id="closeBtn" title="Zavřít">✕</button>
      </span>
    </div>
    <div class="display">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="out" id="out">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="key fn" data-k="C">C</button>
      <button class="key fn" data-k="back">⌫</button>
      <button class="key fn" data-k="%">%</button>
      <button class="key op" data-k="/">÷</button>

      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key op" data-k="*">×</button>

      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key op" data-k="-">−</button>

      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key op" data-k="+">+</button>

      <button class="key fn" data-k="neg">±</button>
      <button class="key" data-k="0">0</button>
      <button class="key" data-k=".">.</button>
      <button class="key eq" data-k="=">=</button>
    </div>

    <!-- now-playing mini bar -->
    <div id="nowbar">
      <div id="miniPlay" title="Přehrát / pauza">▶</div>
      <div id="miniNext" title="Další skladba">⏭</div>
      <div id="miniWrap">
        <div id="miniTitle">— žádná skladba —</div>
        <div id="miniProg"><div id="miniBar"></div></div>
      </div>
      <div id="expandBtn" title="Otevřít přehrávač">▶</div>
    </div>
  </div>

  <!-- WINAMP PLAYER -->
  <div id="player">
    <div class="amp">
      <div class="amp-title">
        <span class="t">◈ CALCAMP PLAYER</span>
        <span class="x" id="closePlayer" title="Sbalit">▬</span>
      </div>

      <div class="lcd">
        <div class="lcd-top">
          <div class="time" id="time">00:00</div>
          <div class="meta">
            <div>128 <b>kbps</b> · 44 <b>kHz</b></div>
            <div id="stmode">◄ STEREO ►</div>
          </div>
        </div>
        <canvas id="viz" width="300" height="38" title="Klikni pro změnu stylu vizualizéru"></canvas>
        <div class="viz-ctl">
          <span id="vizStyleBtn" title="Změnit styl vizualizéru">◈ <b id="vizStyleLabel">SPEKTRUM</b></span>
          <span id="vizFullBtn" title="Vizualizér na celou obrazovku">⛶ ZVĚTŠIT</span>
        </div>
        <div class="marquee-wrap"><span id="trackTitle" class="paused">CALCAMP · nahraj MP3 přes tlačítko ⏏ a spusť přehrávání</span></div>
      </div>

      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0">
      </div>

      <div class="transport">
        <button class="tbtn" data-t="prev" title="Předchozí">⏮</button>
        <button class="tbtn play" data-t="play" id="playBtn" title="Přehrát/Pauza">▶</button>
        <button class="tbtn" data-t="stop" title="Stop">⏹</button>
        <button class="tbtn" data-t="next" title="Další">⏭</button>
        <button class="tbtn eject" data-t="eject" title="Přidat soubory">⏏</button>
      </div>

      <div class="sliders">
        <div class="grp"><label>VOLUME</label>
          <input type="range" id="vol" min="0" max="100" value="80"></div>
        <div class="grp"><label>BALANCE</label>
          <input type="range" id="bal" min="-100" max="100" value="0"></div>
      </div>

      <div class="plwrap">
        <div class="plhead"><span style="color:#7fd0ff;cursor:default">PLAYLIST</span>
          <span id="addFiles">+ PŘIDAT</span></div>
        <ul id="playlist"><li class="empty">Playlist je prázdný. Klikni na „+ PŘIDAT“ nebo ⏏.</li></ul>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" multiple hidden>
<audio id="audio" crossorigin="anonymous"></audio>

<!-- fullscreen vizualizér -->
<div id="vizFull">
  <canvas id="vizBig"></canvas>
  <div id="vizFullBar">
    <span id="vizFullStyle">SPEKTRUM</span>
    <span class="hint">klik = změnit styl · Esc = návrat</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- CALCULATOR ---------- */
  const outEl = document.getElementById('out');
  const exprEl = document.getElementById('expr');
  let cur = '0', prev = null, op = null, freshNum = true;

  const fmt = n => {
    if(!isFinite(n)) return 'Error';
    let s = Math.abs(n) < 1e-12 && n!==0 ? n.toExponential(6) : String(Math.round(n*1e10)/1e10);
    return s;
  };
  const opSym = {'+':'+','-':'−','*':'×','/':'÷'};

  function calc(a,b,o){ a=+a;b=+b;
    return o==='+'?a+b : o==='-'?a-b : o==='*'?a*b : o==='/'? (b===0?NaN:a/b) : b; }

  // oddělení tisíců tenkou mezerou (1 000 000), zachová desetiny, minus i rozepsanou tečku
  function group(s){
    if(s==='Error' || /[eE]/.test(s)) return s;
    const neg=s.startsWith('-'); if(neg) s=s.slice(1);
    let [ip,dp]=s.split('.');
    ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (neg?'-':'') + ip + (s.includes('.') ? '.'+(dp||'') : '');
  }
  function render(){
    const shown = cur.length>12 ? (+cur).toPrecision(8) : cur;
    outEl.textContent = group(shown);
    exprEl.innerHTML = prev!==null ? (group(prev)+' '+opSym[op]) : '&nbsp;'; }

  function press(k){
    if(/^[0-9]$/.test(k)){ cur = freshNum ? k : (cur==='0'?k:cur+k); freshNum=false; }
    else if(k==='.'){ if(freshNum){cur='0.';freshNum=false;} else if(!cur.includes('.')) cur+='.'; }
    else if(k==='C'){ cur='0'; prev=null; op=null; freshNum=true; }
    else if(k==='back'){ cur = freshNum ? cur : (cur.length>1?cur.slice(0,-1):'0'); if(cur==='0')freshNum=true; }
    else if(k==='neg'){ cur = (cur.startsWith('-')?cur.slice(1):'-'+cur); if(cur==='-0')cur='0'; }
    else if(k==='%'){ cur = fmt((+cur)/100); }
    else if(['+','-','*','/'].includes(k)){
      if(op!==null && !freshNum){ const r=calc(prev,cur,op); cur=fmt(r); prev=cur; }
      else prev=cur;
      op=k; freshNum=true;
    }
    else if(k==='='){
      if(op!==null){ const r=calc(prev,cur,op); cur=fmt(r); prev=null; op=null; freshNum=true; }
    }
    render();
  }

  document.getElementById('keys').addEventListener('click', e=>{
    const b=e.target.closest('.key'); if(b) press(b.dataset.k);
  });
  window.addEventListener('keydown', e=>{
    const vf=document.getElementById('vizFull');
    if(vf && vf.classList.contains('on')) return;   // ve fullscreen vizualizéru klávesy neovládají kalkulačku
    const map={'Enter':'=','=':'=','Backspace':'back','Escape':'C','c':'C','C':'C','%':'%'};
    if(/^[0-9]$/.test(e.key)) press(e.key);
    else if('+-*/'.includes(e.key)) press(e.key);
    else if(e.key==='.'||e.key===',') press('.');
    else if(map[e.key]){ e.preventDefault(); press(map[e.key]); }
  });
  render();

  // fake clock in brand
  function tick(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
    document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes()); }
  tick(); setInterval(tick,10000);

  /* ---------- PLAYER ---------- */
  const audio = document.getElementById('audio');
  const fileInput = document.getElementById('fileInput');
  const plEl = document.getElementById('playlist');
  const app = document.getElementById('app');
  let list = [], idx = -1, playing = false;

  const miniTitle = document.getElementById('miniTitle');
  const miniBar = document.getElementById('miniBar');
  const miniPlay = document.getElementById('miniPlay');
  const trackTitle = document.getElementById('trackTitle');
  const playBtn = document.getElementById('playBtn');
  const timeEl = document.getElementById('time');
  const seek = document.getElementById('seek');
  const vol = document.getElementById('vol');
  const bal = document.getElementById('bal');

  const secfmt = s => { s=Math.floor(s||0); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
  const nameFrom = f => f.name.replace(/\.[^.]+$/,'');

  function renderPlaylist(){
    if(!list.length){ plEl.innerHTML='<li class="empty">Playlist je prázdný. Klikni na „+ PŘIDAT“ nebo ⏏.</li>'; return; }
    plEl.innerHTML='';
    list.forEach((t,i)=>{
      const li=document.createElement('li');
      if(i===idx) li.className='active';
      li.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+t.title;
      li.onclick=()=>{ load(i,true); };
      plEl.appendChild(li);
    });
  }

  function setTitle(txt){ miniTitle.textContent=txt; trackTitle.textContent=txt; }

  function load(i, autoplay){
    if(i<0||i>=list.length) return;
    idx=i; audio.src=list[i].url;
    setTitle((i+1)+'. '+list[i].title);
    renderPlaylist();
    if(typeof savePlaylist==='function') savePlaylist();
    if(autoplay) play();
  }

  function ensureAudioGraph(){
    if(audio._graph) return;
    try{
      const AC = window.AudioContext||window.webkitAudioContext;
      const ctx = new AC();
      const src = ctx.createMediaElementSource(audio);
      const analyser = ctx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=0.82;
      const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      const gain = ctx.createGain();
      let node = src;
      node.connect(analyser);
      if(panner){ analyser.connect(panner); panner.connect(gain); }
      else analyser.connect(gain);
      gain.connect(ctx.destination);
      audio._graph={ctx,analyser,panner,gain,
        freq:new Uint8Array(analyser.frequencyBinCount),
        time:new Uint8Array(analyser.fftSize)};
      applyVol(); applyBal();
    }catch(err){ console.warn('audio graph:',err); audio._graph=null; audio._nograph=true; }
  }
  function applyVol(){ const v=vol.value/100;
    if(audio._graph&&audio._graph.gain) audio._graph.gain.gain.value=v; else audio.volume=v; }
  function applyBal(){ if(audio._graph&&audio._graph.panner) audio._graph.panner.pan.value=bal.value/100; }

  function play(){
    if(idx<0 && list.length){ load(0,false); }
    if(idx<0) return;
    ensureAudioGraph();
    if(audio._graph && audio._graph.ctx.state==='suspended') audio._graph.ctx.resume();
    audio.play().then(()=>{}).catch(e=>console.warn(e));
  }
  function pause(){ audio.pause(); }
  function toggle(){ audio.paused ? play() : pause(); }
  function stop(){ audio.pause(); audio.currentTime=0; }
  function next(){ if(list.length) load((idx+1)%list.length, !audio.paused||playing); }
  function prev_(){ if(list.length) load((idx-1+list.length)%list.length, !audio.paused||playing); }

  audio.addEventListener('play', ()=>{ playing=true; playBtn.textContent='⏸'; miniPlay.textContent='⏸';
    trackTitle.classList.remove('paused'); draw(); });
  audio.addEventListener('pause', ()=>{ playing=false; playBtn.textContent='▶'; miniPlay.textContent='▶';
    trackTitle.classList.add('paused'); if(typeof savePlaylist==='function') savePlaylist(); });
  audio.addEventListener('ended', next);
  audio.addEventListener('timeupdate', ()=>{
    const d=audio.duration||0, c=audio.currentTime||0;
    timeEl.textContent=secfmt(c);
    if(d){ seek.value=Math.round(c/d*1000); miniBar.style.width=(c/d*100)+'%'; }
    const now=performance.now(); if(now-lastSave>5000){ lastSave=now; savePlaylist(); }
  });
  audio.addEventListener('loadedmetadata', ()=>{ timeEl.textContent=secfmt(0); });

  seek.addEventListener('input', ()=>{ if(audio.duration) audio.currentTime=seek.value/1000*audio.duration; });
  vol.addEventListener('input', applyVol);
  bal.addEventListener('input', applyBal);

  // transport buttons
  document.querySelector('.transport').addEventListener('click', e=>{
    const b=e.target.closest('.tbtn'); if(!b) return;
    ({play:toggle, stop, next, prev:prev_, eject:()=>fileInput.click()})[b.dataset.t]();
  });
  miniPlay.onclick=toggle;
  document.getElementById('miniNext').onclick=next;
  document.getElementById('addFiles').onclick=()=>fileInput.click();

  // file loading
  fileInput.addEventListener('change', e=>{
    const files=[...e.target.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|ogg|wav|flac|aac)$/i.test(f.name));
    const startEmpty = list.length===0;
    files.forEach(f=>{
      const p = (window.win && window.win.getPath) ? window.win.getPath(f) : (f.path||'');
      list.push({title:nameFrom(f), url:URL.createObjectURL(f), path:p});
    });
    renderPlaylist(); savePlaylist();
    if(startEmpty && list.length){ load(0,true); setOpen(true); }
    fileInput.value='';
  });

  // ---- zapamatování playlistu mezi spuštěními ----
  let lastSave=0;
  function savePlaylist(){
    try{
      const data={ items:list.filter(t=>t.path).map(t=>({title:t.title, path:t.path})),
                   idx, time: audio.currentTime||0 };
      localStorage.setItem('calcamp.playlist', JSON.stringify(data));
    }catch(e){}
  }
  async function restorePlaylist(){
    let data; try{ data=JSON.parse(localStorage.getItem('calcamp.playlist')||'null'); }catch(e){}
    if(!data || !data.items || !data.items.length) return;
    if(!(window.win && window.win.readFile)) return;      // jen v Electronu (přístup k disku)
    for(const it of data.items){
      try{
        const bytes = await window.win.readFile(it.path);
        if(!bytes) continue;                               // soubor zmizel -> přeskoč
        list.push({ title:it.title, url:URL.createObjectURL(new Blob([bytes])), path:it.path });
      }catch(e){}
    }
    if(!list.length) return;
    renderPlaylist();
    const i=Math.min(Math.max(0, data.idx|0), list.length-1);
    load(i, false);                                        // načti poslední skladbu, ale nepřehrávej
    const t=data.time||0;
    if(t>0){ audio.addEventListener('loadedmetadata', function once(){
      try{ audio.currentTime=Math.min(t, (audio.duration||t)); }catch(e){}
      audio.removeEventListener('loadedmetadata', once); }); }
  }

  // ---- fit the OS window exactly around the content ----
  function fitWindow(){
    const c = document.getElementById('calc').getBoundingClientRect();
    const open = app.classList.contains('open');
    const w = Math.ceil(c.width) + (open ? 14 + 330 : 0);
    const h = Math.ceil(c.height);
    if(window.win && window.win.resize){ window.win.resize(w, h); }   // Electron: setContentSize
    else{ const dw=window.outerWidth-window.innerWidth, dh=window.outerHeight-window.innerHeight;
          try{ window.resizeTo(w+dw, h+dh); }catch(e){} }
  }
  function setOpen(open){
    if(open){ app.classList.add('open'); fitWindow(); }          // grow first, then slide in
    else{ app.classList.remove('open'); setTimeout(fitWindow, 360); } // slide out, then shrink
  }

  // expand / collapse player
  document.getElementById('expandBtn').onclick=()=>setOpen(!app.classList.contains('open'));
  document.getElementById('closePlayer').onclick=()=>setOpen(false);

  // fit on first paint (and once fonts settle)
  window.addEventListener('load', ()=>{ fitWindow(); setTimeout(fitWindow, 120);
    restorePlaylist();
    if(location.search.indexOf('open')>=0) setTimeout(()=>setOpen(true), 200); });

  // ---- window controls (Electron) ----
  const wc = window.win;
  if(wc){
    document.getElementById('closeBtn').onclick=()=>wc.close();
    document.getElementById('minBtn').onclick=()=>wc.min();
    const pin=document.getElementById('pinBtn');
    pin.classList.add('pinned');                       // vždy navrchu je default zapnuto
    pin.onclick=async()=>{ const on=await wc.togglePin(); pin.classList.toggle('pinned',!!on); };
  } else {
    // běh v obyčejném prohlížeči — schovej tlačítka okna
    ['pinBtn','minBtn','closeBtn'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });
  }


  /* ---------- VISUALIZER ---------- */
  const canvas=document.getElementById('viz'), vctx=canvas.getContext('2d');
  const bigCanvas=document.getElementById('vizBig'), bctx=bigCanvas.getContext('2d');
  const vizFull=document.getElementById('vizFull');
  const STYLES=['SPEKTRUM','ZRCADLO','BLOKY','VLNA','NORA'];
  let vizStyle=0;
  const peaks={};                       // padající "čepičky" podle počtu sloupců
  const nora={phase:0};                 // stav "králičí nory" (tunelu)

  function getData(){
    if(!audio._graph) return null;
    audio._graph.analyser.getByteFrequencyData(audio._graph.freq);
    audio._graph.analyser.getByteTimeDomainData(audio._graph.time);
    return audio._graph;
  }

  function drawViz(ctx, W, H, g){
    ctx.clearRect(0,0,W,H);
    const style=STYLES[vizStyle];
    const freq=g?g.freq:null, time=g?g.time:null;

    if(style==='VLNA'){                  // osciloskop
      ctx.lineWidth=Math.max(1.5, H/60); ctx.strokeStyle='#2bff77';
      ctx.shadowColor='#0a7d36'; ctx.shadowBlur=Math.min(18,H/12);
      ctx.beginPath();
      const N=time?time.length:64;
      for(let i=0;i<N;i++){
        const v=time?time[i]/128-1:Math.sin(i/6)*0.15;
        const x=i/(N-1)*W, y=H/2+v*H*0.44;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke(); ctx.shadowBlur=0; return;
    }

    if(style==='NORA'){                  // "králičí nora" — tunel, do kterého letíš
      const cx=W/2, cy=H/2, maxR=Math.hypot(W,H)/2;
      let energy=0, bass=0;
      if(freq){ for(let i=0;i<freq.length;i++) energy+=freq[i];
        energy/=freq.length*255;
        for(let i=0;i<8;i++) bass+=freq[i]; bass/=8*255; }
      nora.phase += 0.006 + energy*0.05 + bass*0.03;   // rychlost letu podle hudby
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(nora.phase*0.35 + Math.sin(nora.phase)*0.15);
      const rings=22, sides=6;
      for(let i=rings;i>0;i--){
        const f=((i/rings)+nora.phase)%1;              // 0 = daleko (střed), 1 = blízko (okraj)
        const r=f*f*maxR;                              // kvadraticky -> zrychlení k okraji
        ctx.beginPath();
        for(let s=0;s<=sides;s++){ const a=s/sides*Math.PI*2 + f*0.6;
          const x=Math.cos(a)*r, y=Math.sin(a)*r; s?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath();
        ctx.lineWidth=Math.max(1, f*H/26 + bass*6);
        const hot = f>0.82;
        ctx.strokeStyle = hot ? 'rgba(255,210,58,'+(0.2+f*0.8)+')'
                              : 'rgba(43,255,119,'+(0.10+f*0.85)+')';
        ctx.shadowColor='#0a7d36'; ctx.shadowBlur=6+energy*22;
        ctx.stroke();
      }
      ctx.restore(); ctx.shadowBlur=0; return;
    }

    const bars = W>500?64:40;
    const gap = Math.max(1, W/260);
    const bw = (W-(bars-1)*gap)/bars;
    const key='k'+bars; if(!peaks[key]) peaks[key]=new Float32Array(bars);
    const pk=peaks[key];
    const step = freq?(Math.floor(freq.length/bars)||1):1;

    for(let i=0;i<bars;i++){
      let v = freq ? freq[i*step]/255 : (0.10+0.09*Math.abs(Math.sin(i*0.5+vizStyle)));
      v = Math.min(1, v*(1+i/bars*0.7));       // lehké zvednutí výšek pro hezčí obraz
      const h=Math.max(2, v*H), x=i*(bw+gap);

      if(style==='ZRCADLO'){
        const half=h/2, grad=ctx.createLinearGradient(0,H/2-half,0,H/2+half);
        grad.addColorStop(0, v>.8?'#ffd23a':'#7dffb0'); grad.addColorStop(.5,'#2bff77'); grad.addColorStop(1,'#0a7d36');
        ctx.fillStyle=grad; ctx.fillRect(x, H/2-half, bw, h);
      } else if(style==='BLOKY'){
        const seg=Math.max(3, Math.round(H/16));
        for(let s=0; s*(seg+1)<h; s++){
          const yy=H-(s+1)*(seg+1)+1, t=(H-yy)/H;
          ctx.fillStyle = t>.82?'#ffd23a' : t>.55?'#2bff77' : '#0f8f42';
          ctx.fillRect(x, yy, bw, seg);
        }
      } else {                                  // SPEKTRUM
        const grad=ctx.createLinearGradient(0,H,0,H-h);
        grad.addColorStop(0,'#0a7d36'); grad.addColorStop(.6,'#2bff77'); grad.addColorStop(1, v>.8?'#ffd23a':'#7dffb0');
        ctx.fillStyle=grad; ctx.fillRect(x, H-h, bw, h);
      }

      if(style!=='ZRCADLO'){                    // padající čepička
        if(h>pk[i]) pk[i]=h; else pk[i]=Math.max(2, pk[i]-H*0.014);
        ctx.fillStyle='#eafff2'; ctx.fillRect(x, H-pk[i]-2, bw, Math.max(2,H/26));
      }
    }
  }

  // malý vizualizér — nepřetržitá smyčka (aktivní / klidový režim)
  function smallLoop(){
    const W=canvas.width, H=canvas.height;
    if(audio.paused){
      vctx.clearRect(0,0,W,H); vctx.fillStyle='rgba(43,255,119,.12)';
      const n=32, bw=(W-62)/n; for(let i=0;i<n;i++) vctx.fillRect(i*(bw+2),H-3,bw,3);
      setTimeout(()=>requestAnimationFrame(smallLoop),110);
    } else {
      drawViz(vctx,W,H,getData());
      requestAnimationFrame(smallLoop);
    }
  }
  smallLoop();
  function draw(){}                       // smyčka běží pořád; ponecháno kvůli volání z 'play'

  // fullscreen vizualizér
  let bigReq=0;
  function sizeBig(){ bigCanvas.width=window.innerWidth; bigCanvas.height=window.innerHeight; }
  function bigLoop(){
    if(!vizFull.classList.contains('on')) return;
    drawViz(bctx, bigCanvas.width, bigCanvas.height, getData());
    bigReq=requestAnimationFrame(bigLoop);
  }
  function enterFull(){
    vizFull.classList.add('on');
    if(wc && wc.setFullScreen){ wc.setFullScreen(true); }            // Electron: fullscreen okna
    else if(vizFull.requestFullscreen){ vizFull.requestFullscreen().catch(()=>{}); }
    setTimeout(sizeBig, 60); sizeBig();
    cancelAnimationFrame(bigReq); bigLoop();
  }
  function exitFull(){
    cancelAnimationFrame(bigReq); vizFull.classList.remove('on');
    if(wc && wc.setFullScreen){ wc.setFullScreen(false); }
    else if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  }
  function setStyleLabels(){ const t=STYLES[vizStyle];
    ['vizStyleLabel','vizFullStyle'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent=t; }); }
  function cycleStyle(){ vizStyle=(vizStyle+1)%STYLES.length; setStyleLabels(); }

  document.getElementById('vizStyleBtn').onclick=cycleStyle;
  canvas.addEventListener('click', cycleStyle);
  document.getElementById('vizFullBtn').onclick=enterFull;
  vizFull.addEventListener('click', cycleStyle);
  window.addEventListener('resize', ()=>{ if(vizFull.classList.contains('on')) sizeBig(); });
  document.addEventListener('fullscreenchange', ()=>{
    if(document.fullscreenElement){ sizeBig(); }
    else { cancelAnimationFrame(bigReq); vizFull.classList.remove('on'); }
  });
  window.addEventListener('keydown', e=>{ if(e.key==='Escape' && vizFull.classList.contains('on')) exitFull(); });

})();
</script>
